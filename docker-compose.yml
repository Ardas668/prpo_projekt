services:
  db:
    image: postgres:16-alpine
    container_name: akademie_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: akademie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d akademie_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: akademie_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: akademie_db
      APP_ENV: development
      APP_PORT: 8000
      APP_HOST: 0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
# Volume mount ./src:/app/src odebrán - na disku U: (Windows) Docker mapuje prázdný adresář a přepisuje zkopírovaný kód

volumes:
  postgres_data:
